{ layout "synfide/ui/layouts/auth.html" }
<h1>Sign in</h1>
<form class="authform" data-mode="login">
  <label>Username <input name="name" autocomplete="username" autofocus></label>
  <label>Password <input type="password" name="pass" autocomplete="current-password"></label>
  <button class="ok">Sign in</button>
  <p class="envmsg" data-msg></p>
</form>
